# The release of a pushed tag vX.Y.Z (tasks V12 and V15, RELEASING.md, design/ADR-M94).
#
# A person (Harry) makes the tag, on the merge commit of the version pull request. This workflow
# then makes the whole release (ADR-M94 §2.2):
# - check: platform/tools/release/release-check.mjs (the tag equals package.json and
#   PLATFORM_VERSION, the CHANGELOG section with its Upgrade notes), and the tagged commit is on
#   main;
# - images: release-images.yml with push: true builds and scans all six images on both
#   architectures, and only then pushes, signs and attests them and writes images.lock;
# - verify-images: every digest of that images.lock carries a cosign signature and a build
#   provenance attestation made by release-images.yml at this exact tag (verify-images.sh);
# - release: creates the GitHub Release from the CHANGELOG section as a draft, attaches
#   images.lock, publishes it and checks that it is immutable; a published release is never changed;
# - npm: starts npm-publish.yml on the tag (workflow_dispatch, the one event a GITHUB_TOKEN may
#   start). npm-publish.yml stays its own file: npm's trusted publisher names that file and the
#   environment `npm` (ADR-M72 §2.3); since ADR-M104 1.1 it needs no approval there.
name: release

on:
  push:
    tags: ['v*']
  # ADR-M104: release-tag.yml creates the tag of a merged version pull request with GITHUB_TOKEN,
  # which starts no workflow, then dispatches this one on the tag. Any other ref is refused.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  COSIGN_VERSION: v3.1.3

jobs:
  check:
    name: check the tag, the versions and the CHANGELOG
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the ancestry check reads main's history
      - name: Started on a tag
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/v*) ;;
            *) echo "::error::release.yml runs on a tag v*, not on $REF"; exit 1 ;;
          esac
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: The release gate
        env:
          TAG: ${{ github.ref_name }}
        run: node platform/tools/release/release-check.mjs tag "$TAG"
      - name: The tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::the tagged commit $GITHUB_SHA is not on main"; exit 1; }
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # The images of the release, built on the tag (ADR-M94 §2.2). The signer is release-images.yml at
  # this tag. Only this job holds the write permissions the image workflow needs.
  images:
    needs: check
    permissions:
      contents: read
      packages: write # push by digest, the index and its tags
      id-token: write # cosign keyless and the attestation (GitHub OIDC)
      attestations: write
    uses: ./.github/workflows/release-images.yml
    with:
      version: ${{ needs.check.outputs.version }}
      push: true

  verify-images:
    name: verify the signatures and attestations of the release images
    needs: [check, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # pull the signatures from GHCR
      attestations: read # gh attestation verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: images-lock-${{ needs.check.outputs.version }}
          path: ${{ runner.temp }}/lock
      - name: The image references
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          node platform/tools/release/release-check.mjs lock "$RUNNER_TEMP/lock/images.lock" \
            "$VERSION" --images-out "$RUNNER_TEMP/images.txt"
      # cosign from the official release, checked against a pinned SHA-256, with retries
      # (platform/tools/release/install-cosign.sh: long retries, unlike the installer action).
      - name: Install cosign
        run: platform/tools/release/install-cosign.sh "$COSIGN_VERSION"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }} # the job's own token, read only; no repository secret
      # The signer is pinned in the script, shared with npm-publish.yml: release-images.yml at the tag.
      - name: cosign verify and gh attestation verify, every image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: platform/tools/release/verify-images.sh "$RUNNER_TEMP/images.txt" "$TAG"

  release:
    name: create the GitHub Release with images.lock
    needs: [check, verify-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # the GitHub Release; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: The notes from the CHANGELOG section
        env:
          TAG: ${{ github.ref_name }}
        run: node platform/tools/release/release-check.mjs tag "$TAG" --notes-out "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: images-lock-${{ needs.check.outputs.version }}
          path: ${{ runner.temp }}/lock
      # An immutable release takes no asset after it is published: the draft gets images.lock first
      # (ADR-M94 §2.4). A draft is not public and not immutable, so a draft left by a failed run is
      # made again; a published release is never changed.
      - name: Create the draft, attach images.lock, publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != true ]; then
              echo "::error::the release $TAG is published; it is never changed by this workflow"
              exit 1
            fi
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/lock/images.lock"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
      # The setting itself needs admin access, which this token does not have: check the result.
      - name: The published release is immutable
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          immutable="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .immutable)"
          [ "$immutable" = true ] || {
            echo "::error::the release $TAG is not immutable: turn on immutable releases (RELEASING.md §4); npm is not started"
            exit 1; }

  npm:
    name: start npm-publish on the tag
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # gh workflow run; nothing else
    steps:
      - name: Start npm-publish.yml (environment npm, no approval since ADR-M104 1.1)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh workflow run npm-publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
