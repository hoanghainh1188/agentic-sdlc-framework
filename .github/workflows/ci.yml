# CI for the platform repo (design/D-08 task A09).
#
# GitHub Free: a private repository cannot make a check "required". A red check blocks the
# merge by process only (PR template, Person B). After the GitHub Team upgrade, make the
# `ci-ok` job the single required check (platform/GETTING-STARTED.md).
#
# Actions minutes (GitHub Free: 2,000 per month for the whole organization). GitHub bills every
# job rounded up to a whole minute, so short checks share one job (`scan`). A push to main runs
# nothing: the pull request already ran every check, and the daily run checks main again.
name: ci

on:
  # Every branch, no path filter. ready_for_review: a draft skips the heavy jobs until then.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Keep these two strings equal to DAILY_CRON and WEEKLY_CRON below.
    - cron: '0 18 * * 1-6' # daily, 03:00 JST: new CVEs; checks and db when main changed
    - cron: '0 18 * * 0' # weekly, Monday 03:00 JST: every job, including the heavy ones
  workflow_dispatch: # every job

# Every job only reads the repository. Do not widen this without review.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Blocking thresholds (D-08 A09 AC3). Change them here only.
  # Accepted exceptions go in .gitleaks.toml, .trivyignore or .semgrepignore, with a reason.
  TRIVY_BLOCK_SEVERITY: CRITICAL
  TRIVY_REPORT_SEVERITY: HIGH # listed in the job summary, does not block
  SEMGREP_BLOCK_SEVERITY: ERROR
  SEMGREP_RULESETS: p/default p/github-actions
  # Pinned tools: version and SHA-256 of the linux x64 release archive.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  TRIVY_VERSION: 0.74.0
  TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  SEMGREP_IMAGE: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
  # Infrastructure owned by task A02. The compose job runs only when this file exists.
  COMPOSE_FILE_PATH: platform/deploy/docker-compose.yml
  DAILY_CRON: '0 18 * * 1-6'
  WEEKLY_CRON: '0 18 * * 0'

jobs:
  # One job for the short checks (each one alone takes under a minute): what to run, then
  # Gitleaks, Trivy and Semgrep. Every scanner runs even when an earlier one fails.
  scan:
    name: detect changes, secrets, dependencies, code
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      run_checks: ${{ steps.decide.outputs.run_checks }}
      run_compose: ${{ steps.decide.outputs.run_compose }}
      run_sandbox_image: ${{ steps.decide.outputs.run_sandbox_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history; the change detection needs the base
          persist-credentials: false
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # all = every job runs (manual and weekly runs); daily = the daily run on main.
          all=false; daily=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            all=true
          elif [ "$EVENT_NAME" = schedule ] && [ "$SCHEDULE" = "$WEEKLY_CRON" ]; then
            all=true
          elif [ "$EVENT_NAME" = schedule ]; then
            daily=true
          fi

          # checks and db: every pull request. The daily run skips them when main has no commit
          # in the last 25 hours (the pull requests already ran them on that code).
          checks=true; reason="always, except on a daily run without changes on main"
          if [ "$daily" = true ] && [ -z "$(git log -1 --since='25 hours ago' --format=%H HEAD)" ]; then
            checks=false; reason="daily run and main unchanged in the last 25 hours"
          fi
          echo "run_checks=$checks" >> "$GITHUB_OUTPUT"
          echo "checks and db jobs: run=$checks ($reason)" | tee -a "$GITHUB_STEP_SUMMARY"

          # Heavy jobs: pull requests that change their paths (not while a draft), weekly and
          # manual runs. They also wait for the checks job to pass.
          # $1 = output name, $2 = label, $3 = reason when the paths changed, rest = paths.
          decide_heavy() {
            name=$1; label=$2; changed=$3; shift 3
            run=false
            if [ "$name" = run_compose ] && [ ! -f "$COMPOSE_FILE_PATH" ]; then
              why="$COMPOSE_FILE_PATH does not exist yet (task A02)"
            elif [ "$all" = true ]; then
              run=true; why="$EVENT_NAME run"
            elif [ "$daily" = true ]; then
              why="daily run: the heavy jobs run on the weekly schedule"
            elif [ "$DRAFT" = true ]; then
              why="draft pull request: runs when marked ready for review"
            elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              run=true; why="base commit unknown, running to be safe"
            elif [ -n "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "$@")" ]; then
              run=true; why="$changed changed"
            else
              why="$changed unchanged"
            fi
            echo "$name=$run" >> "$GITHUB_OUTPUT"
            echo "$label: run=$run ($why)" | tee -a "$GITHUB_STEP_SUMMARY"
          }

          # Infrastructure (A02, A03), the OpenBao client (A04), the LiteLLM adapter and Cost
          # Controller (C03), the runner (C04), the intent workflow on Temporal (B07): their live
          # tests need Docker.
          decide_heavy run_compose "Compose integration job" \
            "platform/deploy/, the OpenBao client, the LiteLLM adapter, the Cost Controller, the runner, the intent workflow or a live test" \
            platform/deploy/ platform/packages/secrets/ platform/tests/integration/openbao/ platform/packages/adapters/model-litellm/ platform/packages/core/src/cost/ platform/tests/integration/litellm/ platform/apps/runner/ platform/tests/integration/runner/ platform/apps/worker/src/workflows/ platform/apps/worker/src/temporal.ts platform/packages/workflow-client/ platform/tests/integration/workflow/compose-smoke.test.ts platform/tests/integration/deploy/seaweedfs-access.test.ts

          # C04: the sandbox images, the runner and the package proxy (design/ADR-M25 §2.9).
          # C09: the gate steps and the worker too, which the pilot suite runs with the real runner.
          decide_heavy run_sandbox_image "Sandbox image job" \
            "a sandbox image, the runner, the agent adapter, the package proxy, the gate steps, the worker or a live test" \
            platform/sandbox-images/ platform/apps/runner/ platform/deploy/verdaccio/ platform/tests/integration/sandbox-image/ platform/packages/adapters/agent-openhands/ platform/tests/integration/agent/ platform/packages/core/src/workflow/ platform/apps/worker/ platform/tests/integration/pilot/ platform/tests/integration/workflow/g1-g3/

      # Diagrams: every SVG carries the SHA-256 of its Mermaid source (scripts/diagrams.py). The
      # author renders with `pnpm diagrams:render` and commits the SVG; CI never commits.
      - name: Diagrams match their Mermaid sources
        if: ${{ !cancelled() }}
        run: python3 scripts/diagrams.py check

      # Gitleaks
      - name: Install gitleaks
        if: ${{ !cancelled() }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Gitleaks rule self-test (sdlc-api-token, task B03)
        if: ${{ !cancelled() }}
        run: |
          # A leaked platform token must be found; the fake fixture must stay allow-listed.
          dir="$RUNNER_TEMP/gitleaks-selftest"
          mkdir -p "$dir"
          printf 'sdlc_pat_%s\n' "$(head -c 32 /dev/urandom | basenc --base64url | tr -d '=\n')" > "$dir/leak.txt"
          if "$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact --no-banner --exit-code 1 "$dir"; then
            echo "the sdlc-api-token rule did not find a platform token" >&2
            exit 1
          fi
          "$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact --no-banner --exit-code 1 platform/tests/gitleaks
      - name: Gitleaks scan (any finding blocks)
        if: ${{ !cancelled() }}
        run: |
          status=0
          # --log-opts HEAD: the full history of the checked-out commit only. The default (--all)
          # would also scan other branches fetched by fetch-depth 0, such as open PRs of other tasks.
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --log-opts HEAD --redact --verbose --exit-code 1 \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" . || status=$?
          count=$(jq length "$RUNNER_TEMP/gitleaks.json" 2>/dev/null || echo "unknown")
          echo "### gitleaks: $count finding(s) (values redacted)" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Trivy (before Semgrep, which writes semgrep.json into the working tree)
      - name: Install trivy
        if: ${{ !cancelled() }}
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$archive"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trivy
      - name: Trivy report (does not block)
        if: ${{ !cancelled() }}
        run: |
          "$RUNNER_TEMP/trivy" fs --scanners vuln,misconfig --include-dev-deps \
            --severity "$TRIVY_REPORT_SEVERITY,$TRIVY_BLOCK_SEVERITY" --ignorefile .trivyignore \
            --disable-telemetry --skip-version-check --exit-code 0 \
            --format table --output "$RUNNER_TEMP/trivy.txt" .
          {
            echo "### trivy: $TRIVY_REPORT_SEVERITY and $TRIVY_BLOCK_SEVERITY findings (only $TRIVY_BLOCK_SEVERITY blocks)"
            echo '```text'
            cat "$RUNNER_TEMP/trivy.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Trivy scan (severity CRITICAL blocks)
        if: ${{ !cancelled() }}
        run: |
          "$RUNNER_TEMP/trivy" fs --scanners vuln,misconfig --include-dev-deps \
            --severity "$TRIVY_BLOCK_SEVERITY" --ignorefile .trivyignore \
            --disable-telemetry --skip-version-check --exit-code 1 .

      # Semgrep
      - name: Semgrep scan (severity ERROR blocks)
        if: ${{ !cancelled() }}
        run: |
          configs=""
          for ruleset in $SEMGREP_RULESETS; do configs="$configs --config $ruleset"; done
          status=0
          # shellcheck disable=SC2086 # $configs is a list of flags
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan $configs --severity "$SEMGREP_BLOCK_SEVERITY" --error \
            --metrics off --disable-version-check --json-output semgrep.json || status=$?
          count=$(jq '.results | length' semgrep.json 2>/dev/null || echo "unknown")
          echo "### semgrep: $count finding(s) at severity $SEMGREP_BLOCK_SEVERITY" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  checks:
    name: build, lint, test
    needs: scan
    # Runs even when a scanner failed. != 'false': runs when scan could not decide.
    if: ${{ !cancelled() && needs.scan.outputs.run_checks != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: Lint workflows (actionlint)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  compose:
    name: integration (compose core)
    # Starts only after scan and checks passed: no heavy run on a change that fails the checks.
    needs: [scan, checks]
    # Shows as "skipped" (not passed) when scan says no.
    if: needs.scan.outputs.run_compose == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create a random .env (A02 script, no GitHub secrets)
        run: |
          for script in platform/deploy/scripts/init-env.sh platform/deploy/scripts/up.sh; do
            [ -f "$script" ] || { echo "::error::$script is missing; the compose job needs it (task A02)"; exit 1; }
          done
          sh platform/deploy/scripts/init-env.sh
      - name: Start the core profile and wait until healthy
        env:
          SDLC_WAIT_TIMEOUT: '600' # cold image pulls on GitHub runners (A02 default: 300)
        run: sh platform/deploy/scripts/up.sh core
      - run: pnpm test:integration
      # A03, A04: OpenBao bootstrap and the OpenBao client, each on its own throw-away Compose
      # project (throw-away test keys, never printed). Separate from the core stack above.
      - run: pnpm test:openbao
      # A12: SeaweedFS's filer, volume server and master unreachable from another container, the S3
      # gRPC port refuses unauthenticated IAM calls, start.sh fails closed; own throw-away project.
      - run: pnpm test:seaweedfs
      # C03: LiteLLM with keys from OpenBao (profile "models") and the Cost Controller, on its own
      # throw-away Compose project with a stub model (throw-away test keys, never printed).
      - run: pnpm test:litellm
      # C04: sandbox egress and hardening on the runner's Docker Engine (per-run internal networks,
      # fixture image in a throw-away registry:2, stub services; everything removed afterwards).
      - run: pnpm test:runner
      # C04 session 3: the sdlc-runner container in the profile "sandbox" (socket proxy, Verdaccio,
      # runner-credentials, clean-up at start), on its own throw-away Compose project.
      - run: pnpm test:runner-compose
      # B03: the sdlc-api image, its database password from OpenBao (api-credentials) and a token
      # from `sdlc admin bootstrap`, on its own throw-away Compose project (throw-away test keys).
      - run: pnpm test:api
      # B07 session 2: the intent workflow on the real Temporal (sticky queues), workers stopped
      # and started; own throw-away Compose project and a throw-away platform PostgreSQL.
      - run: pnpm test:workflow-compose
      - name: Show service state and logs
        if: failure()
        run: |
          docker compose -f "$COMPOSE_FILE_PATH" --env-file platform/deploy/.env --profile core ps --all
          docker compose -f "$COMPOSE_FILE_PATH" --env-file platform/deploy/.env --profile core logs --no-color --tail 200
      - name: Stop and remove everything
        if: always()
        run: |
          [ -f platform/deploy/.env ] || exit 0
          docker compose -f "$COMPOSE_FILE_PATH" --env-file platform/deploy/.env --profile core down --volumes --remove-orphans

  sandbox-image:
    # C04 (design/ADR-M25 §2.9, QUESTIONS #54): build the sandbox image node24, scan it with Trivy
    # (vulnerabilities and licences, ADR-M10 §2.1) and run it hardened with the real package
    # proxy. Nothing is pushed anywhere except a throw-away registry:2 on 127.0.0.1 inside the job:
    # no GHCR, no GitHub secrets, no keys.
    name: sandbox image (node24)
    needs: [scan, checks]
    if: needs.scan.outputs.run_sandbox_image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (no push)
        run: |
          ref="$(sh platform/sandbox-images/build.sh node24 --no-push)"
          docker save "$ref" -o "$RUNNER_TEMP/node24.tar"
          echo "Built $ref" >> "$GITHUB_STEP_SUMMARY"
      - name: Install trivy
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$archive"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trivy
      - name: Report (does not block)
        run: |
          "$RUNNER_TEMP/trivy" image --input "$RUNNER_TEMP/node24.tar" --scanners vuln \
            --severity "$TRIVY_REPORT_SEVERITY,$TRIVY_BLOCK_SEVERITY" \
            --ignorefile platform/sandbox-images/.trivyignore \
            --disable-telemetry --skip-version-check --exit-code 0 \
            --format table --output "$RUNNER_TEMP/trivy-image.txt"
          {
            echo "### trivy image node24: $TRIVY_REPORT_SEVERITY and $TRIVY_BLOCK_SEVERITY findings (only $TRIVY_BLOCK_SEVERITY blocks)"
            echo '```text'
            cat "$RUNNER_TEMP/trivy-image.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Scan vulnerabilities (severity CRITICAL blocks)
        run: |
          "$RUNNER_TEMP/trivy" image --input "$RUNNER_TEMP/node24.tar" --scanners vuln \
            --severity "$TRIVY_BLOCK_SEVERITY" --ignorefile platform/sandbox-images/.trivyignore \
            --disable-telemetry --skip-version-check --exit-code 1
      # ADR-M10 §2.1: the CRITICAL licence category (AGPL, SSPL, commercial) blocks.
      - name: Scan licences (CRITICAL category blocks)
        run: |
          "$RUNNER_TEMP/trivy" image --input "$RUNNER_TEMP/node24.tar" --scanners license \
            --severity "$TRIVY_BLOCK_SEVERITY" \
            --disable-telemetry --skip-version-check --exit-code 1
      # Hardened sandbox from the image by digest (throw-away registry:2), with Verdaccio: Node 24,
      # pnpm through corepack and the proxy, no other way out.
      - run: pnpm test:sandbox-image
      # C05 (design/ADR-M29): the runner drives the real OpenHands Agent Server in a node24 sandbox
      # with a scripted stub model (no provider, no key) and a throw-away PostgreSQL.
      - run: pnpm test:agent
      # C09 (D-08 C09 AC1–AC5): G1–G6 on the sample repository's shape with the real runner, the
      # node24 sandbox and the Agent Server (stub model), the intent workflow on the Temporal test
      # server, a local Git host that protects main, and a throw-away PostgreSQL. One file at a time.
      - run: pnpm test:pilot
      - name: Remove the image archive
        if: always()
        run: rm -f "$RUNNER_TEMP/node24.tar"

  db:
    # Task A06: migrations and tenant isolation on a throw-away PostgreSQL (same image and init
    # script as Compose). Runs on every PR: DB code changes outside platform/deploy/ too.
    name: integration (database)
    needs: scan
    # Same condition as checks: only the daily run on an unchanged main skips it.
    if: ${{ !cancelled() && needs.scan.outputs.run_checks != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Database tests (fail if no database is available)
        run: pnpm test:db
      # Task B07: the intent workflow on the Temporal test server (pinned by version and SHA-256 in
      # the script; the cached archive is checked again on every run, QUESTIONS #92).
      - name: Cache the Temporal test server archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sdlc/temporal-test-server
          key: temporal-test-server-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platform/deploy/scripts/temporal-test-server.sh') }}
      - name: Intent workflow tests (Temporal test server + database)
        run: pnpm test:workflow

  ci-ok:
    name: ci-ok
    needs: [scan, checks, compose, sandbox-image, db]
    # The summary for pull requests (the future required check). Scheduled runs need no summary:
    # a failed job there already marks the run red.
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::a CI job ended with '$result'"; exit 1 ;;
            esac
          done
