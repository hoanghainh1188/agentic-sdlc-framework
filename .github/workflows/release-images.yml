# The platform's images on GHCR for a release (task V04, design/ADR-M66; ADR-M94 from task V15).
#
# Builds sdlc-api, sdlc-worker, sdlc-runner, sdlc-otel-collector, sandbox-node24 and
# tool-project-docs for linux/amd64 and linux/arm64 (each on its own native runner) and scans each
# one with Trivy (CRITICAL blocks, the thresholds of ci.yml): the job scan, which runs
# release-images-scan.yml. Then, with `push: true` only, and only after ALL twelve scans passed
# (ADR-M94 §2.5):
# - push: pushes each architecture by digest and scans that digest again from GHCR;
# - publish: joins them in one multi-arch index tagged with the version and `sha-<commit>`, and
#   refuses a version tag that already exists (tags never move); signs every index with cosign
#   keyless (GitHub OIDC, Fulcio, Rekor) and records a GitHub build provenance attestation; BuildKit
#   attaches an SPDX SBOM and SLSA provenance to every image;
# - lock: writes `images.lock` (an artifact and the job summary), the six references pinned by
#   digest, which release.yml attaches to the GitHub Release.
#
# Callers: release.yml on the tag vX.Y.Z (`push: true`; the signer is then release-images.yml at
# that tag). A person may also run it by hand: `push: false` builds and scans only (nothing leaves
# the runner); a push is accepted only on the tag of its version. A pull request that changes the
# version runs release-images-scan.yml from ci.yml. A push and a public package are public actions (R040).
name: release-images

on:
  workflow_call:
    inputs:
      version:
        description: Release version, equal to the root package.json version (for example 0.1.1)
        type: string
        required: true
      push:
        description: Push, sign and attest (false = build and scan only)
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: Release version, equal to the root package.json version (for example 0.1.1)
        type: string
        required: true
      push:
        description: Push, sign and attest (false = build and scan only)
        type: boolean
        default: false

# Every job only reads the repository; the jobs that push widen it for themselves.
permissions:
  contents: read

concurrency:
  group: release-images-${{ inputs.version }}
  cancel-in-progress: false

env:
  # Keep these equal to ci.yml (platform/tests/deploy/release-images.test.ts checks it).
  TRIVY_BLOCK_SEVERITY: CRITICAL
  TRIVY_REPORT_SEVERITY: HIGH
  TRIVY_VERSION: 0.74.0
  TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
  TRIVY_ARM64_SHA256: b94ce1976bbf3c15b514b605ee88be7c6d94a29be2302847ff01cb794d47aad5
  COSIGN_VERSION: v3.1.3
  # The one registry path (ADR-M66 §2.1). platform/deploy/images.lock uses the same.
  IMAGE_PREFIX: ghcr.io/hoanghainh1188/agentic-sdlc-framework

jobs:
  check:
    name: check the version and the ref
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      short_sha: ${{ steps.check.outputs.short_sha }}
      epoch: ${{ steps.check.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          VERSION: ${{ inputs.version }}
          PUSH: ${{ inputs.push }}
          REF: ${{ github.ref }}
        run: |
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::version must be X.Y.Z, got '$VERSION'"; exit 1; }
          pkg="$(jq -r .version package.json)"
          [ "$pkg" = "$VERSION" ] || {
            echo "::error::version $VERSION differs from package.json ($pkg)"; exit 1; }
          # A push only on the release tag (ADR-M94): never from main or a pull request branch.
          if [ "$PUSH" = true ] && [ "$REF" != "refs/tags/v$VERSION" ]; then
            echo "::error::push only on refs/tags/v$VERSION, not $REF"; exit 1
          fi
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

  # Every image on both architectures is built and scanned before the job push starts.
  scan:
    needs: check
    uses: ./.github/workflows/release-images-scan.yml
    with:
      version: ${{ inputs.version }}
      cache: ${{ inputs.push }}

  push:
    name: push ${{ matrix.image }} (${{ matrix.arch }}) by digest
    # Only after all twelve scans passed: a failed scan leaves nothing of the release on GHCR.
    needs: [check, scan]
    if: inputs.push
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write # the push by digest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image:
          [
            sdlc-api,
            sdlc-worker,
            sdlc-runner,
            sdlc-otel-collector,
            sandbox-node24,
            tool-project-docs,
          ]
        include:
          - image: sdlc-api
            context: .
            dockerfile: platform/apps/api/Dockerfile
            ignorefile: .trivyignore
          - image: sdlc-worker
            context: .
            dockerfile: platform/apps/worker/Dockerfile
            ignorefile: .trivyignore
          - image: sdlc-runner
            context: .
            dockerfile: platform/apps/runner/Dockerfile
            ignorefile: .trivyignore
          - image: sdlc-otel-collector
            context: platform/deploy/otel-collector
            dockerfile: platform/deploy/otel-collector/Dockerfile
            ignorefile: .trivyignore
          - image: sandbox-node24
            context: platform/sandbox-images/node24
            dockerfile: platform/sandbox-images/node24/Dockerfile
            ignorefile: platform/sandbox-images/.trivyignore
          # X04 PR 3b (ADR-M89): the first register tool, registered by its digest.
          - image: tool-project-docs
            context: .
            dockerfile: platform/apps/tool-project-docs/Dockerfile
            ignorefile: .trivyignore
    env:
      SOURCE_DATE_EPOCH: ${{ needs.check.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install trivy
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if [ "$ARCH" = arm64 ]; then
            archive="trivy_${TRIVY_VERSION}_Linux-ARM64.tar.gz"; sum="$TRIVY_ARM64_SHA256"
          else
            archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"; sum="$TRIVY_SHA256"
          fi
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$archive"
          echo "$sum  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trivy
      # 1. Push the scanned build by digest. Same inputs: the layers come from the cache the job
      # scan wrote; BuildKit adds the SBOM and the provenance (ADR-M66 §2.3, §2.4).
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}-${{ inputs.version }}
      # 2. Scan the pushed digest itself, from GHCR: the image that publish tags and signs is the
      # scanned one, also if step 1 missed the cache (review of PR #276). A failure leaves the
      # digest untagged and unsigned; publish never runs.
      - name: Trivy scan of the pushed digest (severity CRITICAL blocks)
        env:
          IGNOREFILE: ${{ matrix.ignorefile }}
          PLATFORM: linux/${{ matrix.arch }}
          REF: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}
        run: |
          "$RUNNER_TEMP/trivy" image --image-src remote --platform "$PLATFORM" --scanners vuln \
            --severity "$TRIVY_BLOCK_SEVERITY" --ignorefile "$IGNOREFILE" \
            --disable-telemetry --skip-version-check --exit-code 1 "$REF"
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          NAME: ${{ matrix.image }}-${{ matrix.arch }}
        run: |
          printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' || {
            echo "::error::no digest from the push"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$NAME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.image }}-${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error

  publish:
    name: tag, sign and attest ${{ matrix.image }}
    needs: [check, push]
    if: inputs.push
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # the multi-arch index and its tags
      id-token: write # cosign keyless and the attestation (GitHub OIDC)
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image:
          [
            sdlc-api,
            sdlc-worker,
            sdlc-runner,
            sdlc-otel-collector,
            sandbox-node24,
            tool-project-docs,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: platform/tools/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the architectures and tag
        id: index
        env:
          REPO: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ inputs.version }}
          SHORT_SHA: ${{ needs.check.outputs.short_sha }}
        run: |
          # Tags never move: a version that is already on GHCR is refused (delete it in the
          # package settings first, on purpose).
          if docker buildx imagetools inspect "$REPO:$VERSION" >/dev/null 2>&1; then
            echo "::error::$REPO:$VERSION already exists"; exit 1
          fi
          amd64="$(cat "$RUNNER_TEMP/digests/$IMAGE-amd64")"
          arm64="$(cat "$RUNNER_TEMP/digests/$IMAGE-arm64")"
          docker buildx imagetools create -t "$REPO:$VERSION" -t "$REPO:sha-$SHORT_SHA" \
            "$REPO@$amd64" "$REPO@$arm64"
          digest="$(docker buildx imagetools inspect "$REPO:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || {
            echo "::error::no index digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # cosign from the official release, checked against a pinned SHA-256, with retries
      # (platform/tools/release/install-cosign.sh: long retries, unlike the installer action).
      - name: Install cosign
        run: platform/tools/release/install-cosign.sh "$COSIGN_VERSION"
      - name: Sign (cosign keyless)
        env:
          REF: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@${{ steps.index.outputs.digest }}
        run: cosign sign --yes "$REF"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - name: Keep the reference
        env:
          IMAGE: ${{ matrix.image }}
          REF: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@${{ steps.index.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/refs"
          printf '%s\n' "$REF" > "$RUNNER_TEMP/refs/$IMAGE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ref-${{ matrix.image }}
          path: ${{ runner.temp }}/refs/${{ matrix.image }}
          retention-days: 7
          if-no-files-found: error

  lock:
    name: write images.lock
    needs: publish
    if: inputs.push
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ref-*
          path: ${{ runner.temp }}/refs
          merge-multiple: true
      - name: Write the lock file
        env:
          VERSION: ${{ inputs.version }}
        run: |
          refs="$RUNNER_TEMP/refs"
          out="$RUNNER_TEMP/images.lock"
          {
            echo "# Generated by .github/workflows/release-images.yml for v$VERSION (run $GITHUB_RUN_ID)."
            echo "# An asset of the GitHub Release v$VERSION; never edited or replaced (ADR-M94 §2.4)."
            echo "SDLC_IMAGES_VERSION=$VERSION"
            echo "SDLC_IMAGE_API=$(cat "$refs/sdlc-api")"
            echo "SDLC_IMAGE_WORKER=$(cat "$refs/sdlc-worker")"
            echo "SDLC_IMAGE_RUNNER=$(cat "$refs/sdlc-runner")"
            echo "SDLC_IMAGE_OTEL_COLLECTOR=$(cat "$refs/sdlc-otel-collector")"
            echo "SDLC_IMAGE_SANDBOX_NODE24=$(cat "$refs/sandbox-node24")"
            echo "SDLC_IMAGE_TOOL_PROJECT_DOCS=$(cat "$refs/tool-project-docs")"
          } > "$out"
          {
            echo "### images.lock for v$VERSION"
            echo '```sh'
            cat "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: images-lock-${{ inputs.version }}
          path: ${{ runner.temp }}/images.lock
          retention-days: 90
          if-no-files-found: error
