# Publishes the CLI to npm as `agentic-sdlc-cli` (task V05, design/ADR-M72, QUESTIONS #365–#367).
#
# Only a released tag `vX.Y.Z` starts it: release.yml dispatches it on the tag after the GitHub
# Release exists (ADR-M94 §2.3), and a person always makes the tag. The job runs in the
# GitHub environment `npm` (required reviewer: Harry), so nothing is published without a second
# yes. npm trusted publishing (OIDC, `id-token: write`) proves the workflow to npm: there is no
# npm token in the repository or its secrets, and every version carries npm provenance.
# Before the first run: create the environment `npm` with its reviewer (GitHub would otherwise
# create it without protection) and add this workflow as the package's trusted publisher on
# npmjs.com (platform/GETTING-STARTED.md, "Publishing the CLI on npm").
# V12, V15 (RELEASING.md, ADR-M94): this stays its own workflow, next to release.yml, with the same
# release gate and image check (job verify-images, before the environment approval), on the
# Release's own images.lock. Never rename this file or the environment: npm's trusted publisher
# names both. The owner may also run it by hand on the tag: the same checks apply.
name: npm-publish

on:
  workflow_dispatch: # on the tag vX.Y.Z only; started by release.yml

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  COSIGN_VERSION: v3.1.3

jobs:
  # The same image check as release.yml (V12 review): npm never publishes a release whose images
  # fail their signature or attestation check. Read only; `publish` waits for it, so the owner is
  # asked to approve the environment `npm` only after it passed.
  verify-images:
    name: verify the release gate and the release images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # pull the signatures from GHCR
      attestations: read # gh attestation verify
    steps:
      - name: The ref is a tag vX.Y.Z with a published GitHub Release; its images.lock
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          printf '%s' "$GITHUB_REF" | grep -Eq '^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || {
            echo "::error::run this workflow on a release tag vX.Y.Z, not $GITHUB_REF"; exit 1; }
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" || {
            echo "::error::the tag $TAG has no GitHub Release"; exit 1; }
          [ "$draft" = false ] || { echo "::error::the release $TAG is a draft"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern images.lock \
            --dir "$RUNNER_TEMP/lock"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: The release gate and the image references
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node platform/tools/release/release-check.mjs tag "$TAG"
          node platform/tools/release/release-check.mjs lock "$RUNNER_TEMP/lock/images.lock" \
            "${TAG#v}" --images-out "$RUNNER_TEMP/images.txt"
      # cosign from the official release, checked against a pinned SHA-256, with retries
      # (platform/tools/release/install-cosign.sh: long retries, unlike the installer action).
      - name: Install cosign
        run: platform/tools/release/install-cosign.sh "$COSIGN_VERSION"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }} # the job's own token, read only; no repository secret
      - name: cosign verify and gh attestation verify, every image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: platform/tools/release/verify-images.sh "$RUNNER_TEMP/images.txt" "$TAG"

  publish:
    name: publish agentic-sdlc-cli
    needs: verify-images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      # No registry-url: setup-node would write an .npmrc that expects a token.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same release gate as release.yml (tasks V12, V15): the tag, package.json,
      # PLATFORM_VERSION, the CHANGELOG section with its Upgrade notes.
      - name: The release gate
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$GITHUB_REF" in refs/tags/v*) ;; *)
            echo "::error::run this workflow on a release tag, not $GITHUB_REF"; exit 1 ;; esac
          node platform/tools/release/release-check.mjs tag "$TAG"
      - name: Build and check the package
        run: |
          mkdir -p "$RUNNER_TEMP/npm"
          pnpm cli:pack-check --out "$RUNNER_TEMP/npm"
      - name: Keep the checked tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentic-sdlc-cli
          path: ${{ runner.temp }}/npm/*.tgz
          retention-days: 30
      - name: Publish with provenance
        working-directory: platform/apps/cli/npm-dist
        run: npm publish --provenance --access public
