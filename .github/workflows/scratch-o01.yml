# SCRATCH (O01 PR 2): runs the job runner-rootless on pushes to this branch only. Removed before
# the pull request.
name: scratch-o01
on:
  push:
    branches: [task/O01-runner-host]
permissions:
  contents: read
env:
  # Blocking thresholds (D-08 A09 AC3). Change them here only.
  # Accepted exceptions go in .gitleaks.toml, .trivyignore or .semgrepignore, with a reason.
  TRIVY_BLOCK_SEVERITY: CRITICAL
  TRIVY_REPORT_SEVERITY: HIGH # listed in the job summary, does not block
  SEMGREP_BLOCK_SEVERITY: ERROR
  SEMGREP_RULESETS: p/default p/github-actions
  # Pinned tools: version and SHA-256 of the linux x64 release archive.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  TRIVY_VERSION: 0.74.0
  TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  # O01 (design/ADR-M91 §2.4): the static Docker Engine and its rootless extras for the job
  # runner-rootless (a second, rootless Engine next to the runner machine's own one).
  DOCKER_ROOTLESS_VERSION: 29.8.2
  DOCKER_STATIC_SHA256: 995d1ef289677f74fd58d8d2c35727b6a4ee389c69db8638a3e42d0487aa5b0f
  DOCKER_ROOTLESS_EXTRAS_SHA256: 707ebf6a5afd88104086e7b6749997b2366e816aeaf2c3ef2305b08fde9ee007
  # runner-rootless, test:runner-split: the link address between the two Engines (O01 PR 2).
  RUNNER_LINK_ADDR: 10.203.0.1
  SEMGREP_IMAGE: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
  # Infrastructure owned by task A02. The compose job runs only when this file exists.
  COMPOSE_FILE_PATH: platform/deploy/docker-compose.yml
  DAILY_CRON: '0 18 * * 1-6'
  WEEKLY_CRON: '0 18 * * 0'

jobs:
  runner-rootless:
    # O01 (design/ADR-M91 §2.4, D-08 O01 AC2): the runner's live tests on a rootless Docker Engine,
    # the Engine the runner gets on the server. Same tests as the compose job's `pnpm test:runner`;
    # the fixture sandbox also checks that the kernel applies the limits (cgroup delegation).
    # Then `pnpm test:runner-split` (O01 AC1): the runner host's project on that Engine.
    name: runner on rootless Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # H04 (ADR-M93): the pinned Gitleaks of the runner's secret scan, on PATH (the in-process
      # runners of the tests find it there) and named for the scanner tests; a missing scanner
      # holds every run at G5.
      - run: |
          gitleaks="$(sh platform/deploy/scripts/gitleaks.sh)"
          dirname "$gitleaks" >> "$GITHUB_PATH"
          echo "SDLC_RUNNER_GITLEAKS_PATH=$gitleaks" >> "$GITHUB_ENV"
      - name: Install the rootless Docker Engine (static archives, pinned by SHA-256)
        run: |
          sudo apt-get install -y --no-install-recommends uidmap slirp4netns dbus-user-session
          base="https://download.docker.com/linux/static/stable/x86_64"
          curl -fsSLo "$RUNNER_TEMP/docker.tgz" "$base/docker-${DOCKER_ROOTLESS_VERSION}.tgz"
          echo "$DOCKER_STATIC_SHA256  $RUNNER_TEMP/docker.tgz" | sha256sum -c -
          curl -fsSLo "$RUNNER_TEMP/extras.tgz" "$base/docker-rootless-extras-${DOCKER_ROOTLESS_VERSION}.tgz"
          echo "$DOCKER_ROOTLESS_EXTRAS_SHA256  $RUNNER_TEMP/extras.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rootless"
          tar -xzf "$RUNNER_TEMP/docker.tgz" -C "$RUNNER_TEMP/rootless" --strip-components=1
          tar -xzf "$RUNNER_TEMP/extras.tgz" -C "$RUNNER_TEMP/rootless" --strip-components=1
      - name: Start the rootless Engine (sets DOCKER_HOST for the next steps)
        run: sh platform/deploy/scripts/test-rootless-docker.sh "$RUNNER_TEMP/rootless"
      # O01 PR 2 (ADR-M91 §2.3, §2.7): the split set-up on one machine, as on a server without a
      # second VM. The link address is a dummy interface that only the two Engines use; the
      # platform runs on the machine's own Engine, the runner host's project on the rootless one.
      - name: The link address (a dummy interface)
        run: |
          sudo ip link add sdlc-link type dummy
          sudo ip addr add "$RUNNER_LINK_ADDR/32" dev sdlc-link
          sudo ip link set sdlc-link up
      - run: pnpm test:runner-split
        env:
          SDLC_RUNNER_SPLIT_LINK_ADDR: ${{ env.RUNNER_LINK_ADDR }}
          SDLC_RUNNER_SPLIT_DOCKER_HOST: ${{ env.DOCKER_HOST }}
          SDLC_RUNNER_SPLIT_PLATFORM_HOST: unix:///var/run/docker.sock
      - name: Show the rootless Engine's log
        if: failure()
        run: XDG_RUNTIME_DIR="/run/user/$(id -u)" journalctl --user -u docker.service --no-pager -n 300 || true
