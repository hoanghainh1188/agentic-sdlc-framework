# Render SVG from Mermaid whenever a .mmd file changes.
name: render-diagrams

on:
  push:
    branches: [main]
    paths: ['diagrams/src/**.mmd']
  pull_request:
    paths: ['diagrams/src/**.mmd']

# Needed: the job commits the rendered SVG files back to the branch.
permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Render SVG
        run: |
          echo '{"args":["--no-sandbox"]}' > /tmp/puppeteer.json
          for f in diagrams/src/*.mmd; do
            name=$(basename "$f" .mmd)
            mmdc -p /tmp/puppeteer.json -i "$f" -o "diagrams/svg/$name.svg" -b white
          done

      - name: Commit SVG if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagrams/svg
          git diff --cached --quiet || git commit -m "chore: update SVG from Mermaid"
          git push
