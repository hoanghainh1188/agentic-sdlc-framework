# Gitleaks configuration (task A09). Uses the default rules; every finding blocks CI.
#
# Accepted exceptions: add an allowlist entry below only with a reason, a date and
# Person B's approval in the pull request. Never allow-list a real secret: rotate it.

[extend]
useDefault = true

# Approved by: Harry (Person B), 2026-09-25, PR #50.
# False positive: the Docker image name valkey/valkey:<version tag> contains "key", so
# generic-api-key reads the tag as a key value. Only lines that name this image are skipped;
# a real key elsewhere on such a line (e.g. in a trailing comment) is still reported.
[[allowlists]]
description = "valkey/valkey image tag is not a secret (PR #50)"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''valkey/valkey:[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?`?\s*(\|.*)?$''']

# Approved by: Harry (Person B), 2026-09-25, PR #68 (task A04).
# False positive: the unit tests of the OpenBao client (platform/tests/secrets/) use made-up
# credentials that all contain the marker "S3CR3T", so the redaction tests can prove that no
# secret value reaches an error or a log. Only generic-api-key matches that contain the marker,
# in the .ts files of that one folder, are skipped. Any other value there is still reported.
[[allowlists]]
description = "Made-up test credentials with the S3CR3T marker in platform/tests/secrets (PR #68)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^platform/tests/secrets/[^/]+\.ts$''']
regexTarget = "match"
regexes = ['''S3CR3T''']

# Approved by: Harry (Person B), 2026-09-27, PR #90 (task B03).
# False positive: generic-api-key reads the script line `"test:api": "SDLC_API_TEST=1 …"` in
# package.json as an "api" key and its value. The line is in the history, which CI scans, so it
# cannot be renamed away without rewriting history. Only this exact line in package.json is
# skipped; any other value on it, or in any other file, is still reported.
[[allowlists]]
description = "The test:api script line in package.json is not a key (PR #90)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^package\.json$''']
regexTarget = "line"
regexes = ['''^\s*"test:api": "SDLC_API_TEST=1 vitest run --config vitest\.integration\.config\.ts platform/tests/integration/api",$''']

# Platform API tokens (task B03, ADR-M26 D6; requested by Harry, 2026-09-27). Every personal API
# token starts with `sdlc_pat_` followed by 32 random bytes in base64url (43 characters), so a
# leaked token is always found, in any file type.
[[rules]]
id = "sdlc-api-token"
description = "Agentic SDLC platform API token"
regex = '''sdlc_pat_[A-Za-z0-9_-]{43}'''
keywords = ["sdlc_pat_"]

# Approved by: Harry (Person B), 2026-09-27, task B03.
# The rule's own test fixture: a clearly fake token (it contains FAKE) in one folder only. Any
# other token, or a token without the marker in that folder, is still reported.
[[allowlists]]
description = "Fake platform token fixture for the sdlc-api-token rule test (B03)"
targetRules = ["sdlc-api-token"]
condition = "AND"
paths = ['''^platform/tests/gitleaks/fixtures/[^/]+$''']
regexTarget = "match"
regexes = ['''FAKE''']
