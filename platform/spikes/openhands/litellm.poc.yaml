# LiteLLM configuration for the C01 spike only (design/ADR-M10). Replaces
# platform/deploy/litellm/config.yaml while the spike runs (compose.poc.yaml).

model_list:
  # Scripted stub model (src/stub-model.ts) on the internal sandbox network. No provider key.
  # A fake price per token makes spend and budgets visible (1000 in + 100 out = USD 0.0012 a call).
  - model_name: poc-stub
    litellm_params:
      model: openai/poc-stub
      api_base: http://poc-stub-model:8080/v1
      api_key: not-a-secret
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002
  # Optional real-model run (Harry, 2026-09-25): a small current Claude model, company key from the
  # Git-ignored .env. The spend cap is the per-run virtual key budget (USD 1.00 total).
  - model_name: poc-claude
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/POC_ANTHROPIC_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

router_settings:
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD
