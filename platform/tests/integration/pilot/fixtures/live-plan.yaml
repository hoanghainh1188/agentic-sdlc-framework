# The plan of the C09 / E07 live test (template T13, schema version 1). Fixed, fictional text.
# Harry merges it once on harryforge/pilot-order-inventory as `.sdlc/plans/INT-2026-0001.yaml`
# (QUESTIONS #230): a throw-away tenant's first intent is always INT-<UTC year>-0001.
# The task text is the stub model's script marker: the agent appends one fixed, fictional line to
# docs/live-test/RUNS.md. The plan allows that folder only, so a live run that a person merges
# (E07, SDLC_PILOT_LIVE_G8=1) never changes the application code.
plan:
  intent_id: INT-2026-0001
tasks:
  - id: T1
    summary: 'Live test of the SDLC platform (fictional). [stub:live]'
    allowed_paths: [docs/live-test/**]
    tools: [file_editor, terminal]
