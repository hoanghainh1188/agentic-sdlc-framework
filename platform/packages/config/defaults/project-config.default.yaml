# Default project configuration (design/D-08 A05, ADR-M18).
# Source of truth: handbook codes table, handbook/00-introduction/05-codes.md (v1.3).
# A project's own YAML is a partial override: mappings merge into this file, lists and values replace.
# The platform refuses overrides that loosen mandatory rules (see platform/packages/config/README.md).
# A codes-table change must be made together with the matching change here, in the same PR
# (platform/tests/config/codes-table-drift.test.ts checks it).
schema_version: 1

oversight:
  # Codes table §4 (gate × risk tier).
  # mode: HITL | HOTL | AUDIT, or POLICY (automatic policy check, G4 only; design/QUESTIONS.md #6).
  # roles: approvers (HITL) or the people notified / sampling (HOTL, AUDIT).
  # approvals: approvals from different people (default 1).
  matrix:
    G1: # §4 row G1: HITL at every tier; Person A
      low: { mode: HITL, roles: [person_a] }
      medium: { mode: HITL, roles: [person_a] }
      high: { mode: HITL, roles: [person_a] }
      critical: { mode: HITL, roles: [person_a] }
    G2: # §4 row G2: HOTL / HITL / HITL / HITL; "Person A; Person B for High+"
      low: { mode: HOTL, roles: [person_a] }
      medium: { mode: HITL, roles: [person_a] }
      high: { mode: HITL, roles: [person_b] }
      critical: { mode: HITL, roles: [person_b] }
    G3: # §4 row G3: HOTL / HITL / HITL / HITL; Person B
      low: { mode: HOTL, roles: [person_b] }
      medium: { mode: HITL, roles: [person_b] }
      high: { mode: HITL, roles: [person_b] }
      critical: { mode: HITL, roles: [person_b] }
    G4: # §4 row G4: Policy check / Policy check / HITL / HITL; D-02 §6.2 "Person A for High"
      low: { mode: POLICY }
      medium: { mode: POLICY }
      high: { mode: HITL, roles: [person_a] }
      critical: { mode: HITL, roles: [person_a] } # design/QUESTIONS.md #5
    G5: # §4 row G5: HOTL / HOTL / HOTL → HITL on breach / HITL; Person A
      low: { mode: HOTL, roles: [person_a] }
      medium: { mode: HOTL, roles: [person_a] }
      high: { mode: HOTL, on_breach: HITL, roles: [person_a] }
      critical: { mode: HITL, roles: [person_a] } # design/QUESTIONS.md #5
    G6: # §4 row G6: Automated + AUDIT / HOTL / HITL / HITL; D-02 §6.2 "Person B for High+"
      low: { mode: AUDIT, roles: [person_b] } # design/QUESTIONS.md #10
      medium: { mode: HOTL, roles: [person_b] } # design/QUESTIONS.md #10
      high: { mode: HITL, roles: [person_b] }
      critical: { mode: HITL, roles: [person_b] }
    G7: # §4 row G7: HITL at every tier; Critical "+ second approver"; Person B
      low: { mode: HITL, roles: [person_b] }
      medium: { mode: HITL, roles: [person_b] }
      high: { mode: HITL, roles: [person_b] }
      critical: { mode: HITL, roles: [person_b, second_approver], approvals: 2 }
    G8: # §4 row G8; Critical "+ business/security approval" = second approver (D-02 §3)
      production:
        low: { mode: HITL, roles: [person_b] }
        medium: { mode: HITL, roles: [person_b] }
        high: { mode: HITL, roles: [person_b] }
        critical: { mode: HITL, roles: [person_b, second_approver], approvals: 2 }
      non_production: # §4 Low "non-production: HOTL"; Medium and High from Ch.15 §15.8 (QUESTIONS.md #7)
        low: { mode: HOTL, roles: [person_b] }
        medium: { mode: HOTL, roles: [person_b] }
        high: { mode: HOTL, roles: [person_b] }
        critical: { mode: HITL, roles: [person_b, second_approver], approvals: 2 }

  # §4 "G3 is always HITL … when the change involves"; D-02 FR-15. Projects may add flags, never remove.
  forced_hitl_g3:
    change_flags:
      - migration
      - breaking_contract
      - new_service_boundary
      - security_boundary
      - system_of_record
      - prod_infrastructure
      - core_business_rule

  # §4 "G7 needs two approvers … for"; D-02 FR-16. Projects may add flags, never remove.
  dual_approval_g7:
    change_flags:
      - migration
      - payment
      - personal_data
      - prod_infrastructure
      - breaking_contract
      - safety_function
    roles: [person_b, second_approver]

  # §4 row G6 "security findings go to HITL at any tier"; Ch.14 §14.8.
  # Findings at or above min_severity make G6 HITL; lower ones are recorded as evidence only, so
  # low / info findings do not make every PR wait for a person (Ch.19). A critical finding always
  # makes G6 HITL (rule M6). design/QUESTIONS.md #19.
  g6_security_findings:
    mode: HITL
    min_severity: high

  # [Proposal] pilot default, review after 2–4 weeks of data (handbook Ch.8). D-02 FR-12; QUESTIONS.md #9.
  hitl_gate_deadline: { value: 1, unit: working_days }
  # [Proposal] pilot default, review after 2–4 weeks of data (handbook Ch.8). D-03 §6; QUESTIONS.md #9.
  hotl_block_window: { value: 4, unit: working_hours }
  # [Proposal] pilot default, review after 2–4 weeks of data (handbook Ch.8). D-02 FR-17; QUESTIONS.md #9.
  approval_expiry: { value: 7, unit: days }
  # [Proposal] pilot default (QUESTIONS.md #90). The escalation raised once when a gate waits for a
  # person longer than hitl_gate_deadline (D-02 FR-12, FR-18). Severity sets its SLA clocks
  # (escalation.sla); notify does not freeze the intent until its acknowledgement is missed.
  gate_overdue: { severity: medium, response_level: notify }

autonomy:
  # Codes table §3 "Maximum autonomy"; D-02 FR-03. The MVP never allows above L2 (D-02 §4.2).
  max_by_risk: { low: L2, medium: L2, high: L1, critical: L0 }

escalation:
  # Acknowledge: codes table §6.3. Resolve: handbook Ch.6 §6.4.
  sla:
    critical:
      acknowledge: { value: 15, unit: minutes }
      resolve: { value: 1, unit: hours }
    high:
      acknowledge: { value: 1, unit: hours }
      resolve: { kind: end_of_working_day }
    medium:
      acknowledge: { value: 1, unit: working_days }
      resolve: { value: 3, unit: working_days }
    low:
      acknowledge: { value: 3, unit: working_days }
      resolve: { kind: next_planned_work }
  # [Proposal] pilot default, review after 2–4 weeks of data (handbook Ch.8). QUESTIONS.md #9.
  # Working-day and working-hour clocks skip non-working days and `holidays` (local dates, e.g. Tết).
  calendar:
    time_zone: Asia/Ho_Chi_Minh
    working_days: [mon, tue, wed, thu, fri]
    working_hours: { start: '09:00', end: '18:00' }
    holidays: []
  # Who receives an escalation first, per route (handbook Ch.6 §6.4 "Who receives it";
  # QUESTIONS.md #74). The raiser picks the route. A missed acknowledgement moves it to the backup,
  # then to governance, which is always the last step (M17). `backup_role: null` = no backup step.
  # Producers of the change are never chosen (FR-18).
  routing:
    intent: { owner_role: person_a, backup_role: person_b }
    technical: { owner_role: person_b, backup_role: second_approver }
    security: { owner_role: person_b, backup_role: second_approver }
    policy: { owner_role: governance, backup_role: null }
  # Roles told when an escalation is raised (handbook Ch.6 §6.4 SLA table "Notify"; codes table
  # §6.3: Critical goes to leadership). The owner of the first step is always told as well. M17:
  # each list contains at least the handbook's roles.
  notify_on_raise:
    critical: [governance, person_a, person_b]
    high: [governance, person_a, person_b]
    medium: [person_a, person_b]
    low: [person_a]
  # [Proposal] pilot default, review after 2–4 weeks of data (handbook Ch.8). QUESTIONS.md #75.
  # Remind the step's holder when this share of the acknowledge window has passed. Each step
  # (owner, backup, governance) gets a fresh acknowledge window from the SLA table.
  reminder_percent: 75
  # Actions that continue while an escalation freezes the intent (handbook Ch.6 §6.5;
  # QUESTIONS.md #76). Only these four codes exist; a project can remove some, never add others.
  safe_actions: [read_only, sandbox_test, unpublished_draft, collect_metrics]

run:
  # [Proposal] pilot default, review after 2–4 weeks of data (handbook Ch.8). D-02 FR-13; QUESTIONS.md #9.
  g6_ci_retries: 2
  loop_detection:
    # D-02 FR-35; handbook Ch.3 §3.6 "more than 3 repeated identical tool calls → stop".
    identical_tool_calls_max: 3
    # [Proposal] pilot default, review after 2–4 weeks of data (handbook Ch.8). FR-35; QUESTIONS.md #9.
    no_progress_window_minutes: 15
  # [Proposal] pilot default, review after 2–4 weeks of data (handbook Ch.8). D-03 §8; QUESTIONS.md #33.
  # Run Contract validity from issue to sandbox start only; the run itself is capped by its
  # max_duration_min. Above 60 minutes gives a warning.
  contract_validity_minutes: 15
  # D-03 §8; ADR-M22. Tolerated clock difference between worker and runner for the "not yet
  # valid" check only. Expiry has no tolerance.
  contract_clock_skew_seconds: 0
  # D-02 FR-32; handbook template T13 (`max_iterations: 30`, `max_minutes: 60`); QUESTIONS.md #13
  # (values chosen by Harry in the C05 plan, 2026-09-27). Caps of a run when
  # the task sets none: the agent stops itself at the iteration cap; the runner interrupts the agent
  # at the time cap, then removes the sandbox. A higher value gives a warning.
  default_max_iterations: 30
  default_max_duration_minutes: 60

budget:
  # D-07 §6; D-02 FR-52; handbook Ch.3 §3.6: warning at 80 %, stop at 100 %.
  warn_percent: 80
  stop_percent: 100
  # [Proposal] pilot default, review after 2–4 weeks of data (handbook Ch.8). D-02 §12; QUESTIONS.md #9.
  default_intent_usd: 10
  # [Proposal] pilot default, review after 2–4 weeks of data (handbook Ch.8). D-02 §12; QUESTIONS.md #9.
  default_run_usd: 2

model_routing:
  # D-07 §4. `api` for client_confidential only when the project AI record allows it (D-02 FR-19).
  allowed_provider_types:
    public: [api, self_hosted]
    internal: [api, self_hosted]
    client_confidential: [api, self_hosted]
    client_restricted: [self_hosted]
    prohibited: []

retention:
  # D-05 §10.1; D-02 FR-44.
  evidence_retention_days: 180

github:
  # D-02 §6.3; ADR-M11.
  poll_interval_seconds: 30

access:
  # Task B03, ADR-M26, QUESTIONS.md #66. D-02 §3: Person A creates intents. Creators may always read.
  # The viewer role never creates intents (mandatory rule M16).
  intent_create_roles: [person_a]
  intent_read_roles: [person_a, person_b, second_approver, pm_brse, governance, admin, viewer]
  # Task B12, ADR-M32, QUESTIONS.md #103. The project AI record (handbook Ch.2 §2.5, T7): D-02 §3
  # says PM / BrSE maintains it, Ch.2 §2.5 says Person A owns it, T7 says both fill it in.
  # Writers may always read. The viewer role never writes it (mandatory rule M19).
  ai_record_write_roles: [person_a, pm_brse]
  ai_record_read_roles: [person_a, person_b, second_approver, pm_brse, governance, admin, viewer]

agents:
  # Handbook Ch.20 §20.8 (decision: Harry, 2026-09-24): recertify every agent every 3 months. The
  # owner is warned when the last recertification is older; the run is not blocked (D-02 FR-36).
  # Mandatory rule M18: never more than 3. Task C10, ADR-M31.
  recertification_months: 3

sandbox:
  # QUESTIONS #59 (A), ADR-M25: one sandbox image per project, built on the pinned OpenHands
  # agent-server base plus the project toolchain, referenced by digest (a tag alone is refused).
  # Default: the pinned base itself (ADR-M10 §2.1), which has no project toolchain.
  image: ghcr.io/openhands/agent-server:1.48.0-python-slim@sha256:8fcfab2dedb4b41b6aef219b9fa9b1f2588033fad3d998ae6aa11fe8c4fcf8b7
