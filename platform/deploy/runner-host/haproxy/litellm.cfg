# Relay to LiteLLM on the platform's link address (task O01, design/ADR-M91 §2.2, QUESTIONS #578).
# One fixed target: the static test platform/tests/deploy/runner-host.test.ts allows exactly one
# `server` line, on SDLC_RUNNER_LINK_ADDR. No log of requests, addresses or bodies.
global
  maxconn 256

defaults
  mode tcp
  timeout connect 5s
  # Long model answers stream for minutes.
  timeout client 15m
  timeout server 15m

frontend health
  mode http
  bind 127.0.0.1:8405
  http-request return status 200

frontend relay
  bind :4000
  default_backend upstream

backend upstream
  server upstream "${SDLC_RUNNER_LINK_ADDR}:4000"
