# Relay to knowledge-db on the platform's link address, port 5433 (task O01, design/ADR-M91 §2.7,
# QUESTIONS #578). One fixed target: the static test platform/tests/deploy/runner-host.test.ts
# allows exactly one `server` line, on SDLC_RUNNER_LINK_ADDR. No log of requests or addresses.
global
  maxconn 64

defaults
  mode tcp
  timeout connect 5s
  timeout client 30m
  timeout server 30m

frontend health
  mode http
  bind 127.0.0.1:8405
  http-request return status 200

frontend relay
  bind :5432
  default_backend upstream

backend upstream
  server upstream "${SDLC_RUNNER_LINK_ADDR}:5433"
