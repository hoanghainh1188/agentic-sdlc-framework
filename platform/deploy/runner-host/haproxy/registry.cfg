# Relay to the platform's sandbox image registry on the link address, on a separate VM only
# (task O01, design/ADR-M91 §2.7, QUESTIONS #599). HTTP mode, GET and HEAD only: the runner host
# pulls images by digest but can never push or delete one. One fixed target: the static test
# platform/tests/deploy/runner-host.test.ts allows exactly one `server` line.
global
  maxconn 64

defaults
  mode http
  timeout connect 5s
  timeout client 10m
  timeout server 10m

frontend health
  bind 127.0.0.1:8405
  http-request return status 200

frontend relay
  bind :5000
  http-request deny deny_status 405 unless METH_GET or METH_HEAD
  default_backend upstream

backend upstream
  server upstream "${SDLC_RUNNER_LINK_ADDR}:5050"
