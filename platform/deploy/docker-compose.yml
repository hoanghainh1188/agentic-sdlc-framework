# Agentic SDLC platform: infrastructure (D-03 section 10, D-08 task A02, design/ADR-M17).
#
# Profiles:
#   core           PostgreSQL, Temporal (+ UI), LiteLLM, Valkey, SeaweedFS, OpenBao
#   observability  Langfuse (web + worker), ClickHouse and the OpenTelemetry Collector (A08,
#                  design/ADR-M35); reuses PostgreSQL, Valkey, SeaweedFS
#   models         OpenBao Agent sidecar that gives LiteLLM its keys from OpenBao (C03,
#                  design/ADR-M24). Always on on the server: pnpm compose:models
#   platform       The platform processes built from this repo: sdlc-api (B03, design/ADR-M26) and
#                  sdlc-worker (B06, design/ADR-M27). Needs core, OpenBao configured and the api and
#                  worker credentials delivered first.
#   sandbox        The runner and what its sandboxes need (C04, design/ADR-M25): sdlc-runner,
#                  the Docker socket proxy, the npm package proxy (Verdaccio) and the local
#                  registry for sandbox images. Needs core, OpenBao configured and the runner
#                  credentials delivered first: pnpm compose:sandbox
#
# Usage (from the repo root; see platform/deploy/README.md):
#   platform/deploy/scripts/init-env.sh           # once: creates platform/deploy/.env (mode 600)
#   pnpm compose:core                             # core profile, waits until healthy
#   pnpm compose:obs                              # core + observability
#   pnpm compose:models                           # core + models (OpenBao configured first)
#   pnpm compose:down                             # stop (volumes are kept)
#
# Rules:
#   - Images are pinned to exact versions. Never use "latest" or a bare major tag.
#   - No MinIO, no Redis, no Elasticsearch (D-01 section 5.8e, D-03 section 10.1).
#   - Secrets come only from .env (never committed). Secret variables use ${VAR:?}, so a missing
#     value stops Compose instead of falling back to a default. Exception: the LiteLLM master and
#     salt keys, which come from OpenBao with the profile "models" (litellm/start.sh, ADR-M24).
#   - Host ports bind to 127.0.0.1 by default (SDLC_BIND_ADDR): the server accepts no inbound
#     internet connections (D-03 section 9).

name: ${COMPOSE_PROJECT_NAME:-sdlc}

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

networks:
  sdlc:
    name: ${COMPOSE_PROJECT_NAME:-sdlc}-net
    # Fixed subnet and gateway: OpenBao AppRole secret IDs are bound to the subnet WITHOUT the
    # gateway, because host processes reach containers from it (A03, A11, design/ADR-M19 §2.5).
    ipam:
      config:
        - subnet: ${SDLC_NETWORK_SUBNET:-172.30.0.0/24}
          gateway: ${SDLC_NETWORK_GATEWAY:-172.30.0.1}

volumes:
  postgres-data:
  seaweedfs-data:
  openbao-data:
  openbao-audit:
  # AppRole role ID and secret ID of the LiteLLM sidecar (mode 600). Written by
  # `openbao/bootstrap.sh litellm-credentials` (runbook T11).
  litellm-approle:
  # LiteLLM configuration with keys, rendered by the sidecar. In memory only (tmpfs), gone when
  # the containers stop. Owned by the sidecar's user (openbao, uid 100); LiteLLM runs as root.
  litellm-config:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,uid=100,gid=1000,mode=0700
  valkey-data:
  clickhouse-data:
  clickhouse-logs:
  # AppRole role ID and secret ID of sdlc-api (mode 600, owner node). Written by
  # `openbao/bootstrap.sh api-credentials` (B03, runbook T11).
  api-approle:
  # AppRole role ID and secret ID of sdlc-worker (mode 600, owner node). Written by
  # `openbao/bootstrap.sh worker-credentials` (B06, runbook T11).
  worker-approle:
  # The worker's second AppRole, cost-controller (the LiteLLM master key for agent runs; C06,
  # design/ADR-M33 §2.5). Written by `openbao/bootstrap.sh worker-credentials`.
  worker-cost-approle:
  # --- profile sandbox (C04, design/ADR-M25) ---
  # The socket proxy's filtered socket; mounted by the proxy and the runner only. In memory,
  # writable by the proxy's user; the socket gets the Docker socket's group (mode 0660).
  docker-proxy:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=64k,uid=65534,gid=${SDLC_DOCKER_GID:-0},mode=0770
  # AppRole role ID and secret ID of sdlc-runner (mode 600, owner node). Written by
  # `openbao/bootstrap.sh runner-credentials` (runbook T11).
  runner-approle:
  # The runner's clones before they go into a sandbox (removed right after the upload).
  runner-work:
  # npm packages cached by the package proxy.
  npm-proxy-storage:
  # Sandbox images of the local registry.
  registry-data:

services:
  # ---------------------------------------------------------------- core ----

  postgres:
    image: postgres:17.11-trixie
    profiles: [core, observability]
    restart: unless-stopped
    networks: [sdlc]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?set PLATFORM_DB_PASSWORD in .env}
      PLATFORM_APP_DB_PASSWORD: ${PLATFORM_APP_DB_PASSWORD:?set PLATFORM_APP_DB_PASSWORD in .env}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD in .env}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?set LITELLM_DB_PASSWORD in .env}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD:?set LANGFUSE_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - ${SDLC_BIND_ADDR:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]

  temporal-schema:
    image: temporalio/admin-tools:1.32.0
    profiles: [core, observability]
    restart: 'no'
    networks: [sdlc]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD in .env}
    volumes:
      - ./temporal/setup-schema.sh:/scripts/setup-schema.sh:ro
    entrypoint: [/bin/sh, /scripts/setup-schema.sh]

  temporal:
    image: temporalio/server:1.32.0
    profiles: [core, observability]
    restart: unless-stopped
    networks: [sdlc]
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: '5432'
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD in .env}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig/dynamicconfig.yaml
      LOG_LEVEL: warn
    volumes:
      - ./temporal/dynamicconfig.yaml:/etc/temporal/dynamicconfig/dynamicconfig.yaml:ro
    ports:
      - ${SDLC_BIND_ADDR:-127.0.0.1}:${TEMPORAL_HOST_PORT:-7233}:7233
    healthcheck:
      <<: *healthcheck-defaults
      # The server image has no Temporal CLI; the frontend gRPC port must accept connections.
      # temporal-namespace (below) then checks real cluster health with the CLI.
      test: [CMD-SHELL, 'nc -z "$$(hostname -i | cut -d" " -f1)" 7233']

  temporal-namespace:
    image: temporalio/admin-tools:1.32.0
    profiles: [core, observability]
    restart: 'no'
    networks: [sdlc]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_NAMESPACE_RETENTION: ${TEMPORAL_NAMESPACE_RETENTION:-30d}
    volumes:
      - ./temporal/create-namespace.sh:/scripts/create-namespace.sh:ro
    entrypoint: [/bin/sh, /scripts/create-namespace.sh]

  temporal-ui:
    image: temporalio/ui:2.54.1
    profiles: [core, observability]
    restart: unless-stopped
    networks: [sdlc]
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
    ports:
      - ${SDLC_BIND_ADDR:-127.0.0.1}:${TEMPORAL_UI_HOST_PORT:-8080}:8080
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD-SHELL, 'wget -q --spider "http://$$(hostname -i | cut -d" " -f1):8080/" || exit 1']

  valkey:
    image: valkey/valkey:8.1.10-alpine3.24
    profiles: [core, observability]
    restart: unless-stopped
    networks: [sdlc]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
      VALKEY_MAXMEMORY: ${VALKEY_MAXMEMORY:-256mb}
    # noeviction is required by Langfuse (BullMQ queues). It applies to the whole server:
    # when maxmemory is reached, writes fail for Langfuse AND LiteLLM (design/ADR-M17).
    # The password goes into a mode-600 config file, never into the server's arguments.
    # docker-entrypoint.sh then drops root and runs valkey-server as the valkey user.
    command:
      - /bin/sh
      - -c
      - >-
        umask 077 &&
        printf 'requirepass %s\nmaxmemory %s\nmaxmemory-policy noeviction\nappendonly yes\nsave ""\n'
        "$$VALKEY_PASSWORD" "$$VALKEY_MAXMEMORY" > /tmp/valkey.conf &&
        chown valkey:valkey /tmp/valkey.conf &&
        exec docker-entrypoint.sh valkey-server /tmp/valkey.conf
    volumes:
      - valkey-data:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$VALKEY_PASSWORD" valkey-cli ping | grep -q PONG']

  litellm:
    image: ghcr.io/berriai/litellm:v1.102.1
    profiles: [core, observability]
    restart: unless-stopped
    networks: [sdlc]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      # Profile "models": wait until the sidecar has rendered the configuration with the keys.
      # Without the profile, LiteLLM starts with config.yaml (development only).
      litellm-agent:
        condition: service_healthy
        required: false
    environment:
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:?set LITELLM_DB_PASSWORD in .env}@postgres:5432/litellm
      # Development without the profile "models" only. With it, the keys come from OpenBao and
      # start.sh drops these. On the server both stay empty in .env (runbook T11).
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-}
      REDIS_HOST: valkey
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
      STORE_MODEL_IN_DB: 'False'
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/start.sh:/sdlc/start.sh:ro
      - litellm-config:/run/litellm:ro
    entrypoint: [sh, /sdlc/start.sh]
    command: [--port, '4000', --telemetry, 'False']
    ports:
      - ${SDLC_BIND_ADDR:-127.0.0.1}:${LITELLM_HOST_PORT:-4000}:4000
    healthcheck:
      <<: *healthcheck-defaults
      start_period: 60s
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=4)

  # OpenBao Agent: renders LiteLLM's configuration with the provider keys, the master key and the
  # salt key from OpenBao into tmpfs (C03, QUESTIONS #1 option B, design/ADR-M24). Same image as
  # OpenBao. Needs OpenBao unsealed and configured, and its AppRole credentials delivered
  # (`openbao/bootstrap.sh litellm-credentials`, runbook T11).
  litellm-agent:
    image: openbao/openbao:2.6.3
    profiles: [models]
    restart: unless-stopped
    networks: [sdlc]
    depends_on:
      openbao:
        condition: service_healthy
    command: [agent, -config=/openbao/agent/agent.hcl]
    environment:
      BAO_ADDR: http://openbao:8200
      # Tracing (A08, ADR-M35 §2.4): when set, config.ctmpl turns on LiteLLM's langfuse_otel and
      # points it at the collector. Empty: no tracing. Set by up.sh with the profile observability.
      SDLC_OTEL_ENDPOINT: ${SDLC_OTEL_ENDPOINT:-}
    volumes:
      - ./litellm/agent.hcl:/openbao/agent/agent.hcl:ro
      # The template. Live tests point SDLC_LITELLM_TEMPLATE at a test template (stub model).
      - ${SDLC_LITELLM_TEMPLATE:-./litellm/config.ctmpl}:/openbao/litellm-template/config.ctmpl:ro
      - litellm-approle:/openbao/approle
      - litellm-config:/run/litellm
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD-SHELL, 'test -s /run/litellm/config.yaml']

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    profiles: [core, observability]
    restart: unless-stopped
    networks: [sdlc]
    environment:
      # One S3 admin identity, read by SeaweedFS from these variables.
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_S3_ACCESS_KEY:?set SEAWEEDFS_S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_S3_SECRET_KEY:?set SEAWEEDFS_S3_SECRET_KEY in .env}
    command:
      - server
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=${SEAWEEDFS_VOLUME_SIZE_LIMIT_MB:-1024}
      - -volume.max=0
      - -s3
      - -s3.port=8333
    volumes:
      - seaweedfs-data:/data
    ports:
      - ${SDLC_BIND_ADDR:-127.0.0.1}:${SEAWEEDFS_S3_HOST_PORT:-8333}:8333
    healthcheck:
      <<: *healthcheck-defaults
      test:
        [
          CMD-SHELL,
          'wget -q -O /dev/null http://127.0.0.1:9333/cluster/healthz && wget -q -O /dev/null http://127.0.0.1:8333/healthz',
        ]

  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48
    profiles: [core, observability]
    restart: 'no'
    networks: [sdlc]
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      SEAWEEDFS_BUCKETS: evidence langfuse
      # A plain delete keeps the older versions (C06 session 2b, ADR-M33 §2.9).
      SEAWEEDFS_VERSIONED_BUCKETS: evidence
    volumes:
      - ./seaweedfs/create-buckets.sh:/scripts/create-buckets.sh:ro
    entrypoint: [/bin/sh, /scripts/create-buckets.sh]

  openbao:
    image: openbao/openbao:2.6.3
    profiles: [core, observability]
    restart: unless-stopped
    networks: [sdlc]
    # Starts uninitialised and sealed. Never dev mode. Initialise, unseal and configure it with
    # openbao/bootstrap.sh (task A03, runbook handbook/03-templates/T11-openbao-runbook.md).
    command: [server]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - ./openbao/openbao.hcl:/openbao/config/openbao.hcl:ro
      # Bootstrap scripts, settings and policies; outside /openbao/config (every .hcl file
      # there is read as server configuration).
      - ./openbao/bootstrap:/openbao/bootstrap:ro
      - openbao-data:/openbao/file
      # File audit device (openbao.hcl). Its own volume, kept when the container is removed.
      - openbao-audit:/openbao/logs
    # No published port (A11, design/QUESTIONS.md #27): OpenBao is reachable only on the Compose
    # network. Key holders and admins use `docker compose exec openbao` (runbook T11).
    healthcheck:
      <<: *healthcheck-defaults
      # Healthy = the API is reachable. It does NOT mean initialised or unsealed (see README).
      test:
        - CMD-SHELL
        - wget -q -O /dev/null 'http://127.0.0.1:8200/v1/sys/health?uninitcode=200&sealedcode=200&standbyok=true'

  # ------------------------------------------------------- observability ----

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.36.6
    profiles: [observability]
    restart: unless-stopped
    networks: [sdlc]
    user: '101:101'
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8123/ping || exit 1']

  langfuse-worker:
    image: langfuse/langfuse-worker:4.47.0
    profiles: [observability]
    restart: unless-stopped
    networks: [sdlc]
    depends_on: &langfuse-depends-on
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    environment: &langfuse-env
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:?set LANGFUSE_DB_PASSWORD in .env}@postgres:5432/langfuse
      NEXTAUTH_URL: ${LANGFUSE_URL:-http://localhost:3000}
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT in .env}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY in .env}
      TELEMETRY_ENABLED: 'false'
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: 'false'
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_CLUSTER_ENABLED: 'false'
      REDIS_HOST: valkey
      REDIS_PORT: '6379'
      REDIS_AUTH: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://seaweedfs:8333
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${SEAWEEDFS_S3_ACCESS_KEY:?set SEAWEEDFS_S3_ACCESS_KEY in .env}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${SEAWEEDFS_S3_SECRET_KEY:?set SEAWEEDFS_S3_SECRET_KEY in .env}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://seaweedfs:8333
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${SEAWEEDFS_S3_ACCESS_KEY:?set SEAWEEDFS_S3_ACCESS_KEY in .env}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${SEAWEEDFS_S3_SECRET_KEY:?set SEAWEEDFS_S3_SECRET_KEY in .env}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
    healthcheck:
      <<: *healthcheck-defaults
      start_period: 60s
      test:
        [
          CMD-SHELL,
          'wget -q -O /dev/null "http://$$(hostname -i | cut -d" " -f1):3030/api/health" || exit 1',
        ]

  langfuse-web:
    image: langfuse/langfuse:4.47.0
    profiles: [observability]
    restart: unless-stopped
    networks: [sdlc]
    depends_on: *langfuse-depends-on
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET in .env}
      # No open sign-up. The only account is the admin created by headless initialisation.
      AUTH_DISABLE_SIGNUP: 'true'
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-sdlc}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-Agentic SDLC}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-sdlc-platform}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-Agentic SDLC platform}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?set LANGFUSE_INIT_PROJECT_PUBLIC_KEY in .env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?set LANGFUSE_INIT_PROJECT_SECRET_KEY in .env}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?set LANGFUSE_INIT_USER_EMAIL in .env}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Platform admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?set LANGFUSE_INIT_USER_PASSWORD in .env}
    ports:
      - ${SDLC_BIND_ADDR:-127.0.0.1}:${LANGFUSE_HOST_PORT:-3000}:3000
    healthcheck:
      <<: *healthcheck-defaults
      start_period: 90s
      test:
        [
          CMD-SHELL,
          'wget -q -O /dev/null "http://$$(hostname -i | cut -d" " -f1):3000/api/public/health" || exit 1',
        ]

  # OpenTelemetry Collector (task A08, design/ADR-M35 §2.4; QUESTIONS #4). One OTLP pipeline to
  # Langfuse v4: sdlc-api, sdlc-worker and LiteLLM send traces here without credentials, and only
  # this service holds the Langfuse project key. up.sh points SDLC_OTEL_ENDPOINT at it when the
  # profile is on. No published port, only the network sdlc: sandboxes never reach it (ADR-M25).
  otel-collector:
    image: sdlc-otel-collector:0.161.0
    build:
      context: ./otel-collector
    profiles: [observability]
    restart: unless-stopped
    networks: [sdlc]
    depends_on:
      langfuse-web:
        condition: service_healthy
    environment:
      # The key of the project Langfuse creates at start (.env); OpenBao with A10 (ADR-M35 §4).
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?set LANGFUSE_INIT_PROJECT_PUBLIC_KEY in .env}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?set LANGFUSE_INIT_PROJECT_SECRET_KEY in .env}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:13133/']

  # ------------------------------------------------------------ platform ----

  # REST API for the CLI (B03, design/ADR-M26). Built from platform/apps/api/Dockerfile; the tag
  # follows the package version. Reads the platform_app database password from OpenBao
  # (kv/api/database) with the AppRole "api"; no secret in the environment or the image.
  sdlc-api:
    image: sdlc-api:0.0.0
    build:
      context: ../..
      dockerfile: platform/apps/api/Dockerfile
    profiles: [platform]
    restart: unless-stopped
    networks: [sdlc]
    depends_on:
      postgres:
        condition: service_healthy
      openbao:
        condition: service_healthy
      temporal-namespace:
        condition: service_completed_successfully
      # The bucket `evidence` with versioning (Evidence Packs, E02).
      seaweedfs-init:
        condition: service_completed_successfully
    environment:
      SDLC_API_HOST: 0.0.0.0
      SDLC_API_PORT: '8080'
      SDLC_API_DB_HOST: postgres
      SDLC_API_DB_NAME: platform
      # Wakes the intent workflow after a change (B07, ADR-M30). Plain gRPC on the Compose network.
      SDLC_API_TEMPORAL_ADDRESS: temporal:7233
      SDLC_API_TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      # E02 (ADR-M48): Evidence Packs in SeaweedFS with the api's identity from OpenBao
      # (kv/api/evidence, `openbao:bootstrap api-evidence-credentials`): reads proposals and diffs
      # to re-check their hashes, reads and writes packs/ only.
      SDLC_API_EVIDENCE_URL: http://seaweedfs:8333
      SDLC_API_EVIDENCE_BUCKET: evidence
      # Traces over OTLP to the collector (A08, ADR-M35). Empty: off. Set by up.sh (observability).
      SDLC_OTEL_ENDPOINT: ${SDLC_OTEL_ENDPOINT:-}
      SDLC_OPENBAO_ADDR: http://openbao:8200
      # Plain HTTP on the Compose network until TLS on OpenBao 8200 (task A10, QUESTIONS #20).
      SDLC_OPENBAO_ALLOW_PLAINTEXT: '1'
      SDLC_OPENBAO_ROLE_ID_FILE: /run/sdlc/approle/role_id
      SDLC_OPENBAO_SECRET_ID_FILE: /run/sdlc/approle/secret_id
    volumes:
      - api-approle:/run/sdlc/approle
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - ${SDLC_BIND_ADDR:-127.0.0.1}:${SDLC_API_HOST_PORT:-8090}:8080
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, node, /app/dist/healthcheck.js]

  # The worker: GitHub poller (B06), escalation clocks (B11) and the Temporal worker of the intent
  # workflow (B07, task queue sdlc-intents). No published port. It reaches GitHub (HTTPS),
  # PostgreSQL, OpenBao and Temporal.
  sdlc-worker:
    image: sdlc-worker:0.0.0
    build:
      context: ../..
      dockerfile: platform/apps/worker/Dockerfile
    profiles: [platform]
    restart: unless-stopped
    networks: [sdlc]
    depends_on:
      postgres:
        condition: service_healthy
      openbao:
        condition: service_healthy
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      SDLC_WORKER_DB_HOST: postgres
      SDLC_WORKER_DB_NAME: platform
      SDLC_WORKER_TEMPORAL_ADDRESS: temporal:7233
      SDLC_WORKER_TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      # Traces over OTLP to the collector (A08, ADR-M35). Empty: off. Set by up.sh (observability).
      SDLC_OTEL_ENDPOINT: ${SDLC_OTEL_ENDPOINT:-}
      SDLC_OPENBAO_ADDR: http://openbao:8200
      # Plain HTTP on the Compose network until TLS on OpenBao 8200 (task A10, QUESTIONS #20).
      SDLC_OPENBAO_ALLOW_PLAINTEXT: '1'
      SDLC_OPENBAO_ROLE_ID_FILE: /run/sdlc/approle/role_id
      SDLC_OPENBAO_SECRET_ID_FILE: /run/sdlc/approle/secret_id
      # C06 session 2 (ADR-M33 §2.5): the second AppRole "cost-controller" (the LiteLLM master key)
      # for agent runs, delivered by `openbao:bootstrap worker-credentials`. Without the files the
      # worker starts with runs off (intents wait at G4).
      SDLC_WORKER_COST_ROLE_ID_FILE: /run/sdlc/cost-approle/role_id
      SDLC_WORKER_COST_SECRET_ID_FILE: /run/sdlc/cost-approle/secret_id
      SDLC_WORKER_LITELLM_URL: http://litellm:4000
      SDLC_WORKER_RUN_EGRESS: litellm:4000,npm-proxy:4873
    volumes:
      - worker-approle:/run/sdlc/approle
      - worker-cost-approle:/run/sdlc/cost-approle
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, node, /app/dist/healthcheck.js]

  # ------------------------------------------------------------- sandbox ----

  # Filtered Docker socket for the runner (design/ADR-M25 §2.5). wollomatic/socket-proxy (MIT,
  # Go, from scratch, no shell). The only service that mounts the Docker socket, read-only; it
  # joins no network and listens on a Unix socket in the volume docker-proxy only.
  # The allowlist is the runner's ALLOWED_ENDPOINTS (docker/client.ts) with the API version; a
  # test keeps both equal (platform/tests/deploy/sandbox-profile.test.ts). The proxy checks the
  # method and path only, not the request body: docker/guard.ts inside the runner checks the
  # container definition (ADR-M25 §2.5, residual risk). Bind mounts are refused by the proxy too.
  docker-socket-proxy:
    image: wollomatic/socket-proxy:1.13.1@sha256:3935b709275e4ec35d6ed5a5c4a1f0d01ed31eec5e7234efc3357ecd47689002
    profiles: [sandbox]
    restart: unless-stopped
    network_mode: none
    user: 65534:${SDLC_DOCKER_GID:-0}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - docker-proxy:/run/docker-proxy
    command:
      - -socketpath=/var/run/docker.sock
      - -proxysocketendpoint=/run/docker-proxy/docker.sock
      - -proxysocketendpointfilemode=0660
      - -allowbindmountfrom=/nonexistent-sdlc-no-bind-mounts
      - -allowhealthcheck
      - -logjson
      - -loglevel=WARN
      - -shutdowngracetime=5
      - '-allowGET=/v1\.44/(_ping|images/[a-zA-Z0-9][a-zA-Z0-9_.-]*(:[0-9]{1,5})?(/[a-zA-Z0-9][a-zA-Z0-9_.-]*)*(:[\w.-]+)?(@sha256:[0-9a-f]{64})?/json|containers/json|containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(json|logs)|containers/sdlc-sandbox-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/archive|networks|networks/[a-zA-Z0-9][a-zA-Z0-9_.-]*|volumes)'
      - '-allowPOST=/v1\.44/(images/create|containers/create|containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(start|wait)|containers/sdlc-sandbox-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/kill|networks/create|networks/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(connect|disconnect)|volumes/create)'
      - '-allowPUT=/v1\.44/containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/archive'
      - '-allowDELETE=/v1\.44/(containers|networks|volumes)/[a-zA-Z0-9][a-zA-Z0-9_.-]*'
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, /healthcheck]

  # npm package proxy of the sandboxes (QUESTIONS #59 option C, ADR-M25 §2.10). Verdaccio (MIT).
  # Its only uplink is registry.npmjs.org; publishing is refused; no web UI; no host port. The
  # runner attaches it to each run's internal network under the alias npm-proxy.
  npm-proxy:
    image: verdaccio/verdaccio:6.10.4@sha256:43c4067288b050422265407ea2fe747e511fcd0c407a85ec90ab9a326d9400cd
    profiles: [sandbox]
    restart: unless-stopped
    networks: [sdlc]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro
      - npm-proxy-storage:/verdaccio/storage
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:4873/-/ping]

  # Local registry for sandbox images (QUESTIONS #54: no GHCR for now). distribution registry:2
  # (Apache-2.0). Published on 127.0.0.1 only, with no authentication: only operators on the
  # server push (platform/sandbox-images/build.sh); the Docker Engine pulls by digest.
  registry:
    image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    profiles: [sandbox]
    restart: unless-stopped
    networks: [sdlc]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
    volumes:
      - registry-data:/var/lib/registry
    ports:
      - 127.0.0.1:${SDLC_REGISTRY_HOST_PORT:-5050}:5000
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:5000/v2/]

  # Runner (C04, design/ADR-M25): provisions one hardened sandbox per run. Built from
  # platform/apps/runner/Dockerfile. Reads the platform_app password from OpenBao
  # (kv/runner/database) with the AppRole "runner"; reaches Docker only through the socket proxy.
  sdlc-runner:
    image: sdlc-runner:0.0.0
    build:
      context: ../..
      dockerfile: platform/apps/runner/Dockerfile
    profiles: [sandbox]
    restart: unless-stopped
    networks: [sdlc]
    depends_on:
      postgres:
        condition: service_healthy
      openbao:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_healthy
      npm-proxy:
        condition: service_healthy
      temporal-namespace:
        condition: service_completed_successfully
      # The bucket `evidence` with versioning (L1 proposals, C06 session 2b).
      seaweedfs-init:
        condition: service_completed_successfully
    # Group of the proxy socket (mode 0660, group = the socket proxy's group).
    group_add: ['${SDLC_DOCKER_GID:-0}']
    environment:
      SDLC_RUNNER_DOCKER_SOCKET: /run/docker-proxy/docker.sock
      SDLC_RUNNER_INSTANCE: ${COMPOSE_PROJECT_NAME:-sdlc}
      SDLC_RUNNER_MAX_SANDBOXES: ${SDLC_RUNNER_MAX_SANDBOXES:-1}
      SDLC_RUNNER_SWEEP_INTERVAL_SECONDS: ${SDLC_RUNNER_SWEEP_INTERVAL_SECONDS:-300}
      SDLC_RUNNER_EGRESS_SERVICES: litellm=${COMPOSE_PROJECT_NAME:-sdlc}-litellm-1:4000,npm-proxy=${COMPOSE_PROJECT_NAME:-sdlc}-npm-proxy-1:4873
      SDLC_RUNNER_NPM_REGISTRY: http://npm-proxy:4873/
      # C05 (ADR-M29): the runner joins each run's network with its own container to call the
      # Agent Server, and leaves at clean-up. LiteLLM as the sandbox sees it.
      SDLC_RUNNER_SELF_CONTAINER: ${COMPOSE_PROJECT_NAME:-sdlc}-sdlc-runner-1
      SDLC_RUNNER_AGENT_LLM_URL: http://litellm:4000
      SDLC_RUNNER_WORK_DIR: /var/lib/sdlc-runner/work
      SDLC_RUNNER_DB_HOST: postgres
      SDLC_RUNNER_DB_NAME: platform
      # C06 session 2 (ADR-M33 §2.6): the task queue sdlc-runner; one activity slot per sandbox.
      SDLC_RUNNER_TEMPORAL_ADDRESS: temporal:7233
      SDLC_RUNNER_TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      # C06 session 2b (ADR-M33 §2.9): L1 proposals go to SeaweedFS with the runner's write-only
      # identity from OpenBao (kv/runner/evidence, `openbao:bootstrap runner-evidence-credentials`).
      SDLC_RUNNER_EVIDENCE_URL: http://seaweedfs:8333
      SDLC_RUNNER_EVIDENCE_BUCKET: evidence
      SDLC_OPENBAO_ADDR: http://openbao:8200
      # Plain HTTP on the Compose network until TLS on OpenBao 8200 (task A10, QUESTIONS #20).
      SDLC_OPENBAO_ALLOW_PLAINTEXT: '1'
      SDLC_OPENBAO_ROLE_ID_FILE: /run/sdlc/approle/role_id
      SDLC_OPENBAO_SECRET_ID_FILE: /run/sdlc/approle/secret_id
    volumes:
      - docker-proxy:/run/docker-proxy
      - runner-approle:/run/sdlc/approle
      - runner-work:/var/lib/sdlc-runner/work
    read_only: true
    # /tmp holds the heartbeat file the health check reads.
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, node, /app/dist/healthcheck.js]
