# Settings for the OpenBao bootstrap (task A03, design/ADR-M19). Not secret.
# Read by openbao/bootstrap.sh (host) and bootstrap/configure.sh (container).
# Plain KEY=value lines only: no quotes, no spaces around "=", no shell expansion.
# Named .conf, not .env: every *.env file is Git-ignored, because .env files hold secrets.

# Key shares and unseal threshold: 3 shares, any 2 unseal (D-03 section 10.2, runbook T11).
BAO_KEY_SHARES=3
BAO_KEY_THRESHOLD=2

# Run Contract signing key (D-03 section 8, D-08 A03 AC2). Never exportable, never deleted.
TRANSIT_KEY=run-contract
TRANSIT_KEY_TYPE=ed25519

# One AppRole per platform process, plus "litellm" for the OpenBao Agent sidecar of LiteLLM (C03);
# each has the policy policies/<role>.hcl.
APPROLE_ROLES=api worker runner cost-controller litellm

# AppRole login tokens: short-lived and renewable (A04 renews them).
APPROLE_TOKEN_TTL=1h
APPROLE_TOKEN_MAX_TTL=4h

# AppRole secret IDs: valid 90 days (2160h). Rotated every 3 months together with the access
# review (handbook Ch.3, runbook T11 section 8). [Proposal] pilot default.
APPROLE_SECRET_ID_TTL=2160h

# Secret IDs work only from these CIDRs (comma-separated). "compose-network" means the subnet of
# the Compose network (SDLC_NETWORK_SUBNET in .env) without its gateway address
# (SDLC_NETWORK_GATEWAY), because host processes reach containers from the gateway (QUESTIONS #37).
SECRET_ID_BOUND_CIDRS=compose-network

# Daily work uses short-lived platform-admin tokens (token role platform-admin), never root.
ADMIN_TOKEN_MAX_TTL=1h
