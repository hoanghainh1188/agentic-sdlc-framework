# LiteLLM Proxy configuration (D-07 section 3; task A02).
# No models and no provider keys yet: models are added in M-C (C03).
# A database is mandatory: without it, budgets block nothing (D-07 section 3).

model_list: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

# Shared Valkey for rate-limit and router state. Valkey runs with
# maxmemory-policy noeviction (needed by Langfuse), so LiteLLM must only
# write keys that expire. Response caching stays off (design/ADR-M17).
router_settings:
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD
