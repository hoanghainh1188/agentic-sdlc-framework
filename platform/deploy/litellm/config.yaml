# LiteLLM Proxy configuration for development WITHOUT the Compose profile "models" (D-07 section 3;
# tasks A02, C03). No models and no provider keys; the master key and the salt key come from .env.
# With the profile "models" (always on the server), LiteLLM uses config.ctmpl instead, rendered by
# the OpenBao Agent sidecar with the keys from OpenBao (start.sh, design/ADR-M24).
# A database is mandatory: without it, budgets block nothing (D-07 section 3).

model_list: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

# Shared Valkey for rate-limit and router state. Valkey runs with
# maxmemory-policy noeviction (needed by Langfuse), so LiteLLM must only
# write keys that expire. Response caching stays off (design/ADR-M17).
router_settings:
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD
